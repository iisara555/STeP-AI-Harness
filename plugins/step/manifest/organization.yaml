  sharedOversight: [ga, nmco, linc, pubsec]
  notes:
    - "ga, nmco, linc, pubsec เป็นการกำกับร่วม (ช่วยกันดู) ผู้ดูแลยืนยันแล้ว 2026-09-20 — ติดต่อผู้กำกับคนใดก็ได้ตามเรื่องที่รับผิดชอบ ไม่ต้องบังคับเลือกคนเดียว"
    - "ผังนี้ระบุการกำกับดูแล ไม่ได้ระบุว่าผู้กำกับมีอำนาจอนุมัติแทนคณะกรรมการหรือผู้มีอำนาจตาม authority.yaml"
    - "ตำแหน่งผู้จัดการโครงการของ ดร.กรพินธุ์ จิระพงษ์ และ ดร.ณัฐธิดา เตชะบุญ ยืนยันแล้ว 2026-09-20; ไฟล์ทำเนียบปี 2565 ที่ระบุเป็นผู้จัดการทั่วไปถือว่าล้าสมัย"
