      position: "ผู้จัดการทั่วไป"
      teams: [linc, crm, sit]
    - name: "อาจารย์ ดร.กรพินธุ์ จิระพงษ์"
      position: "ผู้จัดการโครงการ"
      teams: [linc, pubsec]
    - name: "อาจารย์ ดร.ณัฐธิดา เตชะบุญ"
      position: "ผู้จัดการโครงการ"
      teams: [piti]
