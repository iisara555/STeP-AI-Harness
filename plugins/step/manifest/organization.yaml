      position: "ผู้จัดการทั่วไป"
      teams: [qs, tech-up]
    - name: "อาจารย์ ดร.ภวิกา มงคลกิจทวีผล"
      position: "ผู้จัดการทั่วไป"
      teams: [nmco, isi]
