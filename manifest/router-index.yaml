version: 1
router:
  name: step-router
  version: 2.8.2
  description: Single Source of Truth for STeP AI Skill Discovery & 5-Factor Routing
  scoring:
    weights:
      intent: 0.30
      keyword: 0.25
      path: 0.20
      team: 0.15
      fileType: 0.10
    thresholds:
      high: 0.80
      ambiguous: 0.50

skills:
  # --- AI Harness Governance ---
  - name: step-skill-authoring
    cluster: governance-operations
    domain: ai-governance
    processId: ai.skill-governance
    teams:
      primary: [ai-admin]
      consumers: []
    description: ใช้เมื่อจะสร้างหรือปรับ Skill ของ STeP AI Harness; ตรวจก่อนว่าโจทย์ควรเป็น Skill, Playbook, Rule, Registry หรือ Action และออกแบบ Trigger/Anti-trigger, Source, Authority, Handoff และ Eval ก่อน Pilot
    intent: [create, improve]
    triggers: [สร้าง skill, สร้างสกิล, create skill, add skill, เพิ่ม skill, เพิ่มสกิล, ปรับ skill, แก้ skill, skill ใหม่, skill authoring, skill contract, skill eval, ทำ skill ให้พร้อม pilot]
    paths: ["**/skills/**", "**/manifest/**", "**/router-index.yaml", "**/skill-*"]
    fileTypes: [md, yaml, yml, json]
    requires: [skill_need]
    scope:
      allow:
        - ตรวจ Need Gate ว่าควรเป็น Skill, Playbook, Rule, Registry หรือ Action
        - ออกแบบ Trigger/Anti-trigger, Input, Output, Source, Authority, Handoff และ Context Budget
        - สร้าง eval plan และรายการ registry/router changes ที่จำเป็น
      escalate: {}
      human_only: {}

  # --- Procurement & TOR ---
  - name: tor-review
    cluster: governance-operations
    domain: procurement
    processId: procurement.tor
    teams:
      primary: [afp]
      consumers: [piti, linc, mi, cc, pubsec, qs, ga]
    description: ตรวจ TOR ขอบเขตงาน และความพร้อมของเอกสารจัดซื้อจัดจ้างก่อนส่ง AFP ด้านความครบถ้วน ความสอดคล้อง เกณฑ์ตรวจรับ และความชัดเจน
    intent: [review, check, compare, evaluate]
    triggers: [TOR, ทีโออาร์, ขอบเขตงาน, จัดซื้อ, จัดจ้าง, ข้อกำหนด, เกณฑ์ตรวจรับ, specification, scope of work, ครบถ้วน, เอกสารจัดซื้อ, เอกสารจัดจ้าง, เอกสารพัสดุ, ต้องเตรียมเอกสารอะไร, เอกสารอะไรบ้าง, ข้อกฎหมาย, วินิจฉัยข้อกฎหมาย, ตีความสัญญา, legal interpretation]
    paths: ["**/TOR/**", "**/procurement/**", "**/AFP/**"]
    fileTypes: [docx, pdf, txt]
    requires: [tor_file]
    scope:
      allow:
        - ตรวจความครบถ้วนของโครงสร้าง TOR และขอบเขตงาน
        - ทำ Traceability Matrix (วัตถุประสงค์ -> งาน -> ผลส่งมอบ -> เกณฑ์ตรวจรับ)
        - ตรวจสอบคำกำกวม ข้อกำหนดที่ขัดแย้งกันเอง หรือการล็อกสเปกโดยไม่จำเป็น
        - ช่วยจัดรายการเอกสารจัดซื้อจัดจ้างเบื้องต้นจากแหล่งอ้างอิงที่ยืนยันแล้ว และระบุสิ่งที่ยังต้องให้ AFP ยืนยัน
      escalate: {}
      human_only:
        vendor_selection:
          role: procurement-committee
          authority: procurement-approval
          description: การคัดเลือก ให้คะแนนผู้ยื่นข้อเสนอ หรือตัดสินผู้ชนะเป็นอำนาจของคณะกรรมการจัดซื้อจัดจ้าง
        legal_advice:
          role: human-legal-officer
          authority: legal-advice
          description: การวินิจฉัยข้อกฎหมายหรือความเห็นทางนิติกร
        budget_approval:
          role: afp-finance-head
          authority: budget-allocation
          description: การอนุมัติงบประมาณหรือเปลี่ยนแปลงวงเงิน

  - name: tor-government-writing
    cluster: governance-operations
    domain: procurement
    processId: procurement.tor
    teams:
      primary: [afp]
      consumers: [pm, pubsec, sit]
    description: ร่าง TOR จาก project facts และ current verified source พร้อม traceability และเกณฑ์ตรวจรับ โดยเปิดเผย source gaps
    intent: [create, plan]
    triggers: [ร่าง TOR, เขียน TOR, แบบฟอร์มจัดซื้อ, เอกสารพัสดุ, draft tor]
    paths: ["**/TOR/**", "**/procurement/**"]
    fileTypes: [docx, txt]
    requires: [project_objective, estimated_budget]
    scope:
      allow:
        - ร่างโครงสร้างจาก current template/source หรือ working template ที่ระบุสถานะชัด
        - ทำ requirement/deliverable/acceptance traceability
        - ใช้วัน งบ เกณฑ์ และข้อบังคับเฉพาะเมื่อมี source รองรับ; ถ้าไม่มีให้รอยืนยัน
      escalate: {}
      human_only:
        budget_allocation:
          role: afp-finance-head
          authority: budget-allocation
          description: การอนุมัติวงเงินจัดจ้างจริง

  - name: document-review
    cluster: governance-operations
    domain: governance
    processId: governance.document-review
    teams:
      primary: [ga]
      consumers: ["*"]
    wildcardReason: "all teams create general documents that need a pre-send completeness check"
    description: ตรวจเอกสารทั่วไปก่อนส่งด้านความครบถ้วน ความสอดคล้องภายใน placeholder owner/deadline และสิ่งที่เจ้าของงานต้องแก้เอง
    intent: [review, check, summarize]
    triggers: [ช่วยตรวจเอกสารนี้ก่อนส่ง, ตรวจเอกสารนี้ก่อนส่ง, ตรวจเอกสารก่อนส่ง, เอกสารก่อนส่ง, pre-send review, ตรวจความครบถ้วนเอกสาร, สิ่งที่ฉันต้องแก้เอง, เช็คเอกสาร, ร่างเอกสารทั่วไป, ช่องไหนยังเว้นว่าง]
    paths: ["**/draft/**", "**/documents/**", "**/review/**"]
    fileTypes: [docx, pdf, txt, md, xlsx]
    requires: [target_document]
    scope:
      allow:
        - ตรวจความครบถ้วนและความสอดคล้องภายในของเอกสาร
        - flag วันที่ ตัวเลข ชื่อ owner deadline placeholder หรือ claim ที่ยังรอยืนยัน
        - สรุปสิ่งที่เจ้าของเอกสารต้องแก้เองก่อนส่ง
      escalate:
        tor_or_procurement:
          skill: tor-review
          description: เอกสารเป็น TOR หรือเกี่ยวกับการจัดซื้อจัดจ้าง
        official_correspondence:
          skill: thai-official-documents
          description: เอกสารเป็นหนังสือราชการหรือบันทึกข้อความ
        privacy_or_pii:
          skill: data-privacy-compliance
          description: เอกสารมีข้อมูลส่วนบุคคลหรือความลับที่ต้อง privacy review
        receipt_or_disbursement:
          skill: receipt-audit
          description: เอกสารเป็นใบเสร็จหรือหลักฐานเบิกจ่าย
        lab_result:
          skill: lab-result-review
          description: เอกสารเป็นผลทดสอบหรือข้อมูลห้องปฏิบัติการ
        controlled_qms_document:
          skill: document-record-control
          description: เอกสารเป็น controlled QMS document หรือ record
      human_only:
        final_approval_or_release:
          role: document-owner-or-authorized-signatory
          authority: official-signing
          description: การอนุมัติ ลงนาม ส่งจริง หรือรับรองเอกสารเป็นอำนาจของมนุษย์

  - name: meeting-summary
    cluster: governance-operations
    domain: governance
    processId: governance.meeting
    teams:
      primary: [ga]
      consumers: ["*"]
    wildcardReason: "all teams participate in meetings and need action/milestone extraction"
    description: สรุปบันทึกการประชุม แยกมติ Action item ผู้รับผิดชอบ และประเด็นที่ยังค้าง
    intent: [summarize, review]
    triggers: [ประชุม, meeting, minutes, มติ, รายงานการประชุม, จดประชุม, action item]
    paths: ["**/meeting*/**", "**/minutes/**", "**/notes/**"]
    fileTypes: [txt, md, docx]
    requires: [raw_meeting_notes]
    scope:
      allow:
        - สกัดมติที่ประชุมและข้อตกลง
        - กำหนดผู้รับผิดชอบและวันส่งมอบ
        - ระบุข้อที่ยังไม่ชัดเจนเป็น 'รอยืนยัน'
      escalate: {}
      human_only:
        invented_resolutions:
          role: meeting-chairperson
          authority: official-signing
          description: การแต่งมติหรือสถานะที่ไม่มีในบันทึกจริง

  - name: browser-form-assistant
    cluster: governance-operations
    domain: operations
    processId: governance.facility-booking
    teams:
      primary: [ga]
      consumers: ["*"]
    wildcardReason: "all teams may use approved online forms with confirmation gates"
    description: ผู้ช่วยร่างและตรวจทานข้อมูลแบบฟอร์มออนไลน์แบบมีมนุษย์กำกับ ไม่ส่งแทนโดยพลการ
    intent: [form-submit, fill, create, plan, review]
    triggers: [กรอกฟอร์ม, กรอกแบบฟอร์ม, กดส่งแบบฟอร์ม, ส่งแบบฟอร์ม, submit form, ล็อกอินเว็บ, จองห้องประชุม, ขอใช้ห้องประชุม, ขอใช้สถานที่]
    paths: ["**/form*/**", "**/booking*/**", "**/request*/**"]
    fileTypes: [pdf, docx, txt, html]
    requires: [form_objective]
    scope:
      allow:
        - เปิดเว็บไซต์ สำรวจและอ่านข้อกำหนดของแบบฟอร์ม
        - กรอกข้อมูลฉบับร่างและเลือกตัวเลือกใน dropdown
        - reuse authenticated session ที่ผู้ใช้ opt-in ไว้ โดยไม่เปิดเผยหรือบันทึก plaintext credential
        - แนบไฟล์เอกสารประกอบฉบับร่างและถ่ายภาพหน้าจอตรวจสอบเมื่อไม่มี secret ที่ไม่จำเป็น
        - สรุปข้อมูลที่กรอกทั้งหมดให้ผู้ใช้ตรวจทาน
      escalate:
        form_submission:
          skill: browser-form-assistant
          description: การกดยืนยันส่งฟอร์ม (Submit) หรือจองสิทธิ์ที่มีผลผูกพัน ต้องได้รับคำยืนยันจากผู้ใช้ก่อน
      human_only:
        budget_approval:
          role: afp-finance-head
          authority: budget-allocation
          description: การอนุมัติงบประมาณหรือเปลี่ยนแปลงวงเงิน
        official_signing:
          role: authorized-signatory
          authority: official-signing
          description: การลงนามในหนังสือราชการ สัญญา หรือข้อตกลงผูกพันนิติบุคคล

  - name: project-plan
    cluster: incubation-strategy
    domain: project-management
    processId: project.planning
    teams:
      primary: [pm]
      consumers: [imo, sit, linc, pubsec, piti]
    description: จัดทำและทบทวนแผนโครงการ แผนงานงวด Milestone, Critical Path, RICE Prioritization และ Risk Register
    intent: [plan, review, create]
    triggers: [แผนงาน, project plan, milestone, แผนโครงการ, gantt, กำหนดส่ง, ไทม์ไลน์, wbs, critical path, rice scoring, แบ่งงานโครงการ, กะเวลางานโครงการ]
    paths: ["**/project*/**", "**/plan/**", "**/PM/**"]
    fileTypes: [xlsx, csv, md]
    requires: [project_scope, timeline]
    scope:
      allow:
        - แตก Work Breakdown Structure (WBS)
        - กำหนด Milestone และ Dependency
        - คำนวณ Critical Path และ RICE Scoring
        - วิเคราะห์ความเสี่ยงและมาตรการรับมือ
      escalate: {}
      human_only:
        deadline_extension_approval:
          role: project-director
          authority: budget-allocation
          description: การอนุมัติขยายเวลาโครงการจริง

  - name: project-pre-mortem
    cluster: incubation-strategy
    domain: project-management
    processId: project.planning
    teams:
      primary: [pm]
      consumers: [pubsec, tech-up, tech-spin, foodfabr]
    description: วิเคราะห์และดักจับความเสี่ยงล่วงหน้าก่อนเริ่มสัญญาหรือโครงการ จำแนกความเสี่ยงแบบ Tiger, Paper Tiger และ Elephant in the room
    intent: [analyze, review, plan]
    triggers: [pre-mortem, ความเสี่ยงล่วงหน้า, premortem, tiger paper tiger, elephant in the room, ดักจับความเสี่ยง, จำลองความล้มเหลว, โครงการนี้อาจพัง, โครงการล้มเหลวล่วงหน้า]
    paths: ["**/risk/**", "**/premortem/**", "**/pre-mortem/**", "**/PM/**"]
    fileTypes: [md, docx, xlsx]
    requires: [project_scope]
    scope:
      allow:
        - จำลองสาเหตุความล้มเหลวของโครงการล่วงหน้า
        - จัดกลุ่มความเสี่ยง Tiger, Paper Tiger และ Elephant
        - เสนอมาตรการป้องกันและสัญญาณเตือนล่วงหน้า
      escalate: {}
      human_only:
        policy_waiver_signing:
          role: executive-director
          authority: policy-waiver
          description: การอนุมัติผ่อนผันข้อกำหนดหรือระเบียบความเสี่ยง

  - name: startup-discovery
    cluster: incubation-strategy
    domain: incubation
    processId: incubation.startup-intake
    teams:
      primary: [piti]
      consumers: [isi, eic, imo, mi]
    description: ค้นหาและทดสอบสมมติฐานตลาดสำหรับสตาร์ทอัพและงานวิจัย ด้วย Value Proposition Canvas และ The Mom Test
    intent: [create, review, interview, plan, evaluate]
    triggers: [vpc, value proposition, value proposition canvas, สมมติฐานตลาด, สัมภาษณ์ลูกค้า, customer interview, mom test, problem-solution fit, บ่มเพาะสตาร์ทอัพ, ค้นหาความต้องการลูกค้า, เทคโนโลยีจากอาจารย์, เทคโนโลยีจากงานวิจัย, ผลงานวิจัยไปต่อ]
    paths: ["**/startup/**", "**/incubation/**", "**/discovery/**", "**/PITI/**"]
    fileTypes: [md, docx, pdf]
    requires: [target_customer, core_technology]
    scope:
      allow:
        - จัดทำ Value Proposition Canvas (Customer Profile & Value Map)
        - ออกแบบสคริปต์สัมภาษณ์ The Mom Test
        - สรุปสมมติฐานความต้องการตลาด
      escalate: {}
      human_only:
        grant_intake_approval:
          role: project-director
          authority: budget-allocation
          description: การอนุมัติคัดเลือกสตาร์ทอัพรับทุนหรือเข้าโครงการบ่มเพาะ

  - name: executive-status-update
    cluster: incubation-strategy
    domain: strategy
    processId: strategy.weekly-review
    teams:
      primary: [sit]
      consumers: [imo, pm, pubsec, nmco]
    description: รายงานสถานะโครงการพอร์ตโฟลิโอสำหรับผู้บริหารและบอร์ด ด้วย SBNR Framework และไฟจราจร Traffic-Light
    intent: [summarize, report, review]
    triggers: [status update, sbnr, traffic light, รายงานผู้บริหาร, สรุปสถานะโครงการ, ไฟจราจร, exec update, รายงานบอร์ด]
    paths: ["**/status/**", "**/executive/**", "**/portfolio/**", "**/SIT/**"]
    fileTypes: [md, xlsx, docx, pdf]
    requires: [project_list, progress_data]
    scope:
      allow:
        - จัดทำรายงานสรุป SBNR (Status, Blockers, Next Steps, Risks)
        - ประเมินสัญญาณไฟจราจร Green/Yellow/Red
        - สรุปประเด็นตัดสินใจของผู้บริหาร
      escalate: {}
      human_only:
        budget_adjustment_approval:
          role: afp-finance-head
          authority: budget-allocation
          description: การอนุมัติปรับแผนงบประมาณหรือเปลี่ยนแปลงงวดเงิน

  - name: innovation-okr-mapping
    cluster: incubation-strategy
    domain: strategy
    processId: strategy.weekly-review
    teams:
      primary: [sit]
      consumers: [qs, imo, piti, crm]
    description: ถ่ายทอดเป้าหมายยุทธศาสตร์ อว./มช. สู่ OKRs รายไตรมาสของทีม พร้อมตัวชี้วัดนำและตัวชี้วัดตาม (North Star & Input Metrics)
    intent: [plan, align, review]
    triggers: [okr, okrs, north star, เป้าหมายไตรมาส, ตัวชี้วัด อว, key results, ถ่ายทอดยุทธศาสตร์, input metrics, แปลงเป้าหมายองค์กร, เป้าทีมไตรมาส]
    paths: ["**/okr/**", "**/strategy/**", "**/SIT/**"]
    fileTypes: [md, xlsx, docx]
    requires: [strategic_goals]
    scope:
      allow:
        - กำหนด Objective และ 3 Measurable Key Results
        - วางผัง North Star Metric และ Input Metrics Tree
        - หลีกเลี่ยง Output Trap
      escalate: {}
      human_only:
        kpi_target_approval:
          role: executive-director
          authority: hr-performance-evaluation
          description: การอนุมัติรับรองตัวชี้วัดประเมินผลการปฏิบัติงานองค์กร

  # --- Creative & Communication ---
  - name: designer-brief
    cluster: market-creative
    domain: creative
    processId: creative.branding
    teams:
      primary: [cc]
      consumers: [mi, crm, piti, eic]
    description: จัดทำและตรวจ Creative Brief สำหรับงานออกแบบ Artwork สื่อ และนิทรรศการ
    intent: [create, review, check]
    triggers: [brief, บรีฟ, artwork, โปสเตอร์, ไวนิล, ออกแบบ, graphic, สื่อประชาสัมพันธ์]
    paths: ["**/CC/**", "**/Creative/**", "**/artwork/**", "**/brief/**"]
    fileTypes: [ai, psd, pdf, docx, png, jpg]
    requires: [project_objective, target_audience, dimension_or_format]
    scope:
      allow:
        - รวบรวมขนาดจริง สเปกวัสดุ ข้อความหลัก วันส่งมอบ และผู้ตัดสินใจ
      escalate: {}
      human_only:
        final_print_approval:
