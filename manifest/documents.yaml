  hr-personnel-welfare-2566:
    title: "ประกาศอุทยานวิทยาศาสตร์และเทคโนโลยี มหาวิทยาลัยเชียงใหม่ ว่าด้วย หลักเกณฑ์เกี่ยวกับการบริหารงานบุคคลและสวัสดิการพนักงาน พ.ศ. 2566"
    owner: hd
    type: organization-announcement
    process: people.personnel-welfare
    version: "2566"
    effectiveDate: "2023-01-26"
    effectiveDateSource: "ชื่อไฟล์ต้นฉบับ (20230126); หน้าลงนามไม่ปรากฏในไฟล์ที่ได้รับ"
    legalBasis: "ข้อ 18 แห่งข้อบังคับมหาวิทยาลัยเชียงใหม่ ว่าด้วยการบริหารหน่วยงานของส่วนงานวิชาการและส่วนงานวิชาการภายในของมหาวิทยาลัย พ.ศ. 2555 และมติที่ประชุมคณะกรรมการอำนวยการอุทยานฯ ครั้งที่ 2/2565 เมื่อ 6 ธันวาคม 2565"
    sourceLevel: organization-policy
    authority: approved-organization-policy
    verification: owner-confirmed-current
    status: active
    confirmedBy: "ผู้ดูแล STeP AI ยืนยันเป็นฉบับปัจจุบัน 2026-09-20"
    index: docs/hr-personnel-welfare-index.md
    contentInRepo: false
    sensitivity: restricted
    sensitivityReason: "เอกสารแนบท้ายมีตารางเงินเดือนต่ำสุด/สูงสุด ค่าความเชี่ยวชาญ และสิทธิ์ค่ารักษาพยาบาลรายตำแหน่ง"
    note: "เก็บเฉพาะดัชนีหัวข้อและคำนิยาม ห้ามคัดตัวเลขค่าตอบแทนหรือเนื้อความเต็มเข้า repository สาธารณะ ต้องเปิดจากไฟล์ต้นฉบับของ HD ทุกครั้งที่อ้างอิง"

