    ownershipStatus: organization-mapping
    description: "บ่มเพาะโมเดลธุรกิจ พัฒนาความพร้อมผลิตภัณฑ์/ตลาด และเชื่อมโยงเครือข่ายสนับสนุน"

  industry-problem-solving:
