    title: "ABPlas Laboratory Management Platform"
    url: "https://abplas.step.cmu.ac.th/"
    type: public-official
  nstis:
    title: "National Science and Technology Information System (NSTIS)"
    url: "https://nstis.mhesi.go.th/"
    type: external-government-directory

services:
  service-intake-front-door:
    name: "รับเรื่องและจับคู่บริการ STeP (Service Intake & Triage)"
    leadTeam: crm
    supportTeams: [ga, ifu, les, foodfabr, linc, piti, tech-spin]
    targetAudience: "ผู้ประกอบการ บุคคลทั่วไป นักวิจัย หน่วยงานภายนอก และผู้ใช้บริการอาคาร"
    capabilities:
      - inquiry-triage
      - service-matching
      - visit-and-facility-inquiry
      - handoff-to-service-owner
    processes: [client.inquiry-triage]
    sourceRefs: [step-service-journey, step-oit-2026]
    existenceStatus: public-verified
    ownershipStatus: organization-mapping
    description: "จุดเริ่มต้นสำหรับคัดแยกความต้องการ ตรวจข้อมูลขั้นต่ำ และส่งต่อไปยังบริการ/ทีมที่เหมาะสม"

  incubation-startup:
    name: "บริการบ่มเพาะวิสาหกิจเริ่มต้นและสตาร์ทอัพ (Innovation Incubation & Acceleration)"
    leadTeam: piti
    leadDisplay: "PITi"
    supportTeams: [isi, eic, imo, cc, crm]
    targetAudience: "ผู้ประกอบการรุ่นใหม่ นักศึกษา อาจารย์ และ Startup"
    capabilities:
      - startup-intake
      - business-model-development
      - prototype-and-market-readiness
