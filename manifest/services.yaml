version: 2
description: Official STeP Service Registry — service routing, public discovery sources, and owner-verification status

policy:
  purpose: "ช่วย Router/Skills จับคู่ความต้องการกับบริการและทรัพยากรที่เกี่ยวข้อง โดยไม่ใช้ข้อมูลสาธารณะเป็นสิทธิ์อนุมัติแทนเจ้าของบริการ"
  publicDiscoveryIsNotAuthority: true
  humanVerifyBeforeCommitment: true
  doNotStorePersonalExpertProfiles: true
  lastReviewed: "2026-09-19"

sources:
  step-nsp-services:
    title: "Northern Science Park — Total Innovation Solutions / Services"
    url: "https://www.step.cmu.ac.th/NSP/service.php"
    type: public-official
  step-service-journey:
    title: "STeP — Our Journey / Solution Services"
    url: "https://step.cmu.ac.th/our_journey.php"
    type: public-official
  step-oit-2026:
    title: "STeP OIT 2026 — Public service and e-Service information"
    url: "https://www1.step.cmu.ac.th/oit/oit-2026.php"
    type: public-official
