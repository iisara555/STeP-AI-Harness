    existenceStatus: public-verified
    ownershipStatus: organization-mapping
    description: "ถอดโจทย์ก่อนเลือกเทคโนโลยี แล้วค้นหา expertise, ห้องปฏิบัติการ, เครื่องมือ หรือทีมที่เหมาะสม"

  ip-management:
    name: "บริการทรัพย์สินทางปัญญา (IP Service)"
    leadTeam: piti
    leadDisplay: "PITi"
    supportTeams: [tech-spin]
    targetAudience: "อาจารย์ นักวิจัย บุคลากร มช. และผู้พัฒนานวัตกรรม"
