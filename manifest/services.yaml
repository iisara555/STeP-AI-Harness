resourceResolution:
  expert-and-resource-matching:
    ownerTeam: linc
    purpose: "ค้นหา candidate expert, researcher, lab, equipment หรือ pilot plant จากโจทย์ที่ผ่านการ frame แล้ว"
    preferredSequence:
      - match-service-capability
      - search-step-nsp-public-resources
      - search-nstis-when-needed
      - verify-with-service-owner
    discoverySources: [step-nsp-services, nstis]
    rules:
      - "ค้นหาความสามารถและทรัพยากรก่อนชื่อบุคคล"
      - "ข้อมูล NSTIS/เว็บสาธารณะเป็น discovery evidence ไม่ใช่การรับรอง availability หรือความเหมาะสมขั้นสุดท้าย"
      - "ไม่สร้าง permanent profile รายบุคคลจาก social media หรือข่าวประชาสัมพันธ์"
      - "ก่อนติดต่อ จอง ใช้งบ หรือรับปาก ให้เจ้าของบริการ/ผู้ใช้ยืนยัน candidate และข้อมูลล่าสุด"
      - "หากโจทย์ยังไม่ชัด ให้ใช้ industry-problem-discovery ก่อน matching"
