name: Release to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@step-cmu'
      - name: Validate repository integrity
        run: python3 scripts/validate_repo.py
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$pkg_version" = "$tag_version" || {
            echo "package.json version $pkg_version does not match tag $GITHUB_REF_NAME"
            exit 1
          }
      - name: Build pilot distribution bundle
        run: python3 scripts/build_pilot_bundle.py
      - name: Run test suite
        run: npm test
      - name: Verify package tarball contents
        run: npm pack --dry-run
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
