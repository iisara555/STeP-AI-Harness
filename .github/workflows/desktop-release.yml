name: Build STeP Desktop installers

# Each installer is built on its own OS: Windows (NSIS .exe) and macOS (.dmg for Apple silicon).
# Without the organisation's certificates the Mac apps are ad-hoc signed, which lets them
# run after the user approves them once; with CSC_* and APPLE_* secrets they are signed and notarized.
#
# A `desktop-v<version>` tag, or a manual run with "publish" ticked (which creates that tag), also publishes: a release for that version, and the rolling `desktop-latest` release
# that installed apps read as their update feed (package.json build.publish). Other runs only keep the files as
# workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this commit as desktop-v<package.json version> and update the in-app update feed'
        type: boolean
        default: false
      require_trusted_installers:
        description: 'Require valid Windows Authenticode, a clean Defender scan, and Apple notarization'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

env:
  STEP_DESKTOP_REQUIRE_TRUSTED_INSTALLERS: ${{ vars.STEP_DESKTOP_REQUIRE_TRUSTED_INSTALLERS == 'true' || inputs.require_trusted_installers == true }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            script: dist:win
            artifact: |
              desktop/release/*.exe
              desktop/release/*.exe.blockmap
              desktop/release/latest.yml
          - name: macos-arm64
            os: macos-latest
            script: dist:mac
            artifact: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/*.blockmap
              desktop/release/latest-mac.yml
          # Intel Mac builds stopped after 0.5.35; `npm run dist:mac:x64` still builds one by hand.
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://cdn.npmmirror.com/binaries/electron-builder-binaries/
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Electron downloads its binary on first use. Fetch it in its own step so a slow mirror cannot use up the first
      # smoke's 45-second launch timeout (playwright resolves the binary inside launch).
      - name: Download the Electron binary
        if: runner.os == 'Windows'
        run: node -e "require('electron')"
      # Every PR already runs these on macOS (validate.yml desktop-macos-electron); only Windows runs them here.
      - name: Verify chat and tools with a synthetic provider
        if: runner.os == 'Windows'
        run: npm run test:electron
      - name: Build installer
        env:
          # Organization-wide Desktop app credentials: configured once by IT, built into main only.
          STEP_GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.GOOGLE_DESKTOP_CLIENT_JSON }}
          # A published build must support the default work-account sign-in without employee JSON import.
          STEP_REQUIRE_GOOGLE_DESKTOP_CLIENT: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'true' || 'false' }}
          # Public routing only. The Gemini key remains in Cloud Secret Manager.
          STEP_RECEIPT_CLOUD_URL: ${{ vars.STEP_RECEIPT_CLOUD_URL }}
          STEP_RECEIPT_CLOUD_MODEL: ${{ vars.STEP_RECEIPT_CLOUD_MODEL }}
          # Public address of the organization AI gateway ("AI ขององค์กร"); the OpenRouter key stays on that server.
          STEP_ORGANIZATION_AI_URL: ${{ vars.STEP_ORGANIZATION_AI_URL }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          EXTRA=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          fi
          unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
          if [ -z "$CSC_LINK" ]; then
            # Unset secrets arrive as empty strings, which electron-builder would treat as a certificate path.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then EXTRA+=("-c.mac.identity=-"); fi
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            EXTRA+=("-c.dmg.sign=true")
          fi
          npm run ${{ matrix.script }} -- "${EXTRA[@]}"
      - name: Prepare installer reports
        run: mkdir -p release-preflight
      - name: Notarize and staple the signed Mac disk image
        if: runner.os == 'macOS'
        timeout-minutes: 30
        env:
          STEP_DESKTOP_APPLE_NOTARIZATION_CONFIGURED: ${{ (secrets.MAC_CSC_LINK != '' || secrets.CSC_LINK != '') && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$STEP_DESKTOP_APPLE_NOTARIZATION_CONFIGURED" != true ]; then
            printf '{"submission":"not configured"}\n' > release-preflight/apple-notarization.json
            echo "Apple signing credentials are not configured. The preflight report will show the ticket status."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          DMG="release/STeP-Desktop-${VERSION}-arm64.dmg"
          NOTARY_RESULT="$RUNNER_TEMP/step-desktop-notary.json"
          printf '{"submission":"failed or interrupted"}\n' > release-preflight/apple-notarization.json
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$NOTARY_RESULT"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; if (JSON.parse(readFileSync(process.argv[1], "utf8")).status !== "Accepted") throw new Error("Apple did not accept the DMG"); console.log("Apple notarization: Accepted")' "$NOTARY_RESULT"
          printf '{"submission":"Accepted"}\n' > release-preflight/apple-notarization.json
          xcrun stapler staple "$DMG"
          node scripts/release-artifacts.mjs refresh-dmg macos-arm64 release
      - name: Check the Windows installer with Authenticode and Defender
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/release-preflight-windows.ps1 -Installer "release/STeP-Desktop-Setup-$version.exe" `
            -ApplicationDirectory release/win-unpacked -Report release-preflight/windows.json
      - name: Check the Mac disk image with Gatekeeper and stapler
        if: runner.os == 'macOS'
        env:
          STEP_DESKTOP_APPLE_NOTARIZATION_CONFIGURED: ${{ (secrets.MAC_CSC_LINK != '' || secrets.CSC_LINK != '') && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bash scripts/release-preflight-mac.sh "release/STeP-Desktop-${VERSION}-arm64.dmg" release-preflight/macos.json
      - name: Launch the packaged Mac app from the disk image
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls release/*.dmg | head -1)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -force || true' EXIT
          node test/packaged-launch-smoke.mjs "$MNT/STeP Desktop.app/Contents/MacOS/STeP Desktop"
      - name: Check updater sizes and checksums and record the installer manifest
        run: node scripts/release-artifacts.mjs record "${{ matrix.name }}" release release-preflight/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step-desktop-preflight-${{ matrix.name }}
          path: desktop/release-preflight/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: step-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    # Only a version tag publishes; installed apps then find the new version in `desktop-latest`.
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the merge script's dependencies
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Check the tag matches the app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          TAG="desktop-v${VERSION}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${VERSION}"; exit 1
          fi
          # A version is published once: bump desktop/package.json for the next one.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Collect the release files
        run: |
          for PLATFORM in windows-x64 macos-arm64; do
            node desktop/scripts/release-artifacts.mjs verify "$PLATFORM" \
              "built/step-desktop-$PLATFORM" "built/step-desktop-preflight-$PLATFORM/manifest.json"
          done
          mkdir -p out
          cp built/step-desktop-windows-x64/* out/
          cp built/step-desktop-macos-arm64/* out/
          ls -l out
      - name: Publish the version and update the feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES="STeP Desktop ${VERSION} — what changed is in CHANGELOG.md. Installed apps update themselves from the desktop-latest release."
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "STeP Desktop ${VERSION}" --notes "$NOTES" --latest=false
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest --target "$GITHUB_SHA" --latest=false --title "STeP Desktop · update feed" \
              --notes "The update feed of the STeP Desktop app: always the newest version. Download installers from the desktop-v* releases."
          fi
          # New installers first, the feed files last, so an app never reads a feed whose files are not there yet.
          gh release upload desktop-latest $(ls out/* | grep -v '\.yml$') --clobber
          gh release upload desktop-latest out/latest.yml out/latest-mac.yml --clobber
          for asset in $(gh release view desktop-latest --json assets -q '.assets[].name'); do
            [ -e "out/$asset" ] || gh release delete-asset desktop-latest "$asset" --yes
          done
