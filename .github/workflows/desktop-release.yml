name: Build STeP Desktop installers

# Each installer is built on its own OS: Windows (NSIS .exe) and macOS (.dmg for Apple silicon and
# for Intel). Without the organisation's certificates the Mac apps are ad-hoc signed, which lets them
# run after the user approves them once; with CSC_* and APPLE_* secrets they are signed and notarized.
on:
  pull_request:
    paths: ['desktop/**', 'docs/desktop-*.md', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            script: dist:win
            artifact: release/STeP-Desktop-Setup-*.exe
          - name: macos-arm64
            os: macos-latest
            script: dist:mac
            artifact: release/*.dmg
          - name: macos-x64
            os: macos-15-intel
            script: dist:mac:x64
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify chat and tools with a synthetic provider
        run: npm run test:electron
      - name: Verify NSIS upgrade seam
        if: runner.os == 'Windows'
        run: npm run test:installer
      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            # Unset secrets arrive as empty strings, which electron-builder would treat as a certificate path.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-c.mac.identity=-"; fi
          fi
          npm run ${{ matrix.script }} -- $EXTRA
      - name: Launch the packaged Mac app from the disk image
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls release/*.dmg | head -1)
          export STEP_EXPECT_ARCH=arm64
          [ "${{ matrix.name }}" = "macos-x64" ] && export STEP_EXPECT_ARCH=x64
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -force || true' EXIT
          node test/packaged-launch-smoke.mjs "$MNT/STeP Desktop.app/Contents/MacOS/STeP Desktop"
      - name: Verify packaged Windows chat and restart
        if: runner.os == 'Windows'
        env:
          STEP_EXPECT_ARCH: x64
        run: node test/packaged-launch-smoke.mjs "release/win-unpacked/STeP Desktop.exe"
      - name: Verify full isolated NSIS install and upgrade
        if: runner.os == 'Windows'
        env:
          STEP_INSTALLER_FIXTURE_ID: th.ac.cmu.step.installer-test.ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/package-windows.mjs --prepackaged release/win-unpacked --artifact-name STeP-Installer-Test.exe --fixture-id "$STEP_INSTALLER_FIXTURE_ID"
          node test/installer-payload-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.name }}
          path: desktop/release/qa/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: step-desktop-${{ matrix.name }}
          path: desktop/${{ matrix.artifact }}
          if-no-files-found: error
