name: Build and verify STeP Desktop Store submission
run-name: Build STeP Desktop for Microsoft Store

# This isolated branch uses the repository's existing registered manual workflow path.
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity/Name'
        type: string
        required: true
      publisher:
        description: 'Package/Identity/Publisher'
        type: string
        required: true
      publisher_display_name:
        description: 'Package/Properties/PublisherDisplayName'
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows-msix:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
        working-directory: desktop
    env:
      ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://cdn.npmmirror.com/binaries/electron-builder-binaries/
      STORE_SUBMISSION: 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Require the dedicated Store submission branch and Partner Center identity
        if: env.STORE_SUBMISSION == 'true'
        env:
          STEP_MSIX_IDENTITY_NAME: ${{ inputs.identity_name }}
          STEP_MSIX_PUBLISHER: ${{ inputs.publisher }}
          STEP_MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_DISPLAY_NAME }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/codex/desktop-store-submission-0.6.42') { throw 'Use the dedicated Store submission branch.' }
          if (!$env:STEP_MSIX_IDENTITY_NAME -or !$env:STEP_MSIX_PUBLISHER -or !$env:STEP_MSIX_PUBLISHER_DISPLAY_NAME) {
            throw 'Supply the three values from Product identity in Partner Center.'
          }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build the Windows app
        shell: bash
        env:
          STEP_GOOGLE_DESKTOP_CLIENT_JSON: ${{ github.ref == 'refs/heads/codex/desktop-store-submission-0.6.42' && secrets.GOOGLE_DESKTOP_CLIENT_JSON || '' }}
          STEP_REQUIRE_GOOGLE_DESKTOP_CLIENT: ${{ env.STORE_SUBMISSION }}
          STEP_RECEIPT_CLOUD_URL: ${{ vars.STEP_RECEIPT_CLOUD_URL }}
          STEP_RECEIPT_CLOUD_MODEL: ${{ vars.STEP_RECEIPT_CLOUD_MODEL }}
          STEP_ORGANIZATION_AI_URL: ${{ vars.STEP_ORGANIZATION_AI_URL }}
        run: |
          mkdir -p release/msix-verification
          if ! (npm run build && ./node_modules/.bin/electron-builder --win --x64 --dir --publish never -c.directories.output=release/msix-stage) \
            > release/msix-verification/build.log 2>&1; then
            grep -E 'error TS[0-9]+|Error:|npm error|⨯' release/msix-verification/build.log | head -8 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done || true
            cat release/msix-verification/build.log
            exit 1
          fi
          cat release/msix-verification/build.log
      - name: Create the unsigned package
        id: package
        env:
          STEP_MSIX_IDENTITY_NAME: ${{ inputs.identity_name }}
          STEP_MSIX_PUBLISHER: ${{ inputs.publisher }}
          STEP_MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_DISPLAY_NAME }}
        run: ./scripts/package-msix.ps1 -StoreSubmission:($env:STORE_SUBMISSION -eq 'true')
      - name: Install, activate and check the package
        timeout-minutes: 12
        env:
          STEP_MSIX_PACKAGE: ${{ steps.package.outputs.package }}
          STEP_MSIX_KIT: ${{ steps.package.outputs.kit }}
        run: ./test/verify-msix.ps1
      - name: Verify the unsigned upload file and record its identity
        env:
          STEP_MSIX_PACKAGE: ${{ steps.package.outputs.package }}
          STEP_MSIX_IDENTITY_NAME: ${{ inputs.identity_name }}
          STEP_MSIX_PUBLISHER: ${{ inputs.publisher }}
          STEP_MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = $env:STEP_MSIX_PACKAGE
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
              if ($archive.GetEntry('AppxSignature.p7x')) { throw 'Expected an unsigned Store upload.' }
              $reader = [IO.StreamReader]::new($archive.GetEntry('AppxManifest.xml').Open())
              try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally {
              $archive.Dispose()
          }
          $identity = $manifest.Package.Identity
          $properties = $manifest.Package.Properties
          if ($identity.Name -cne $env:STEP_MSIX_IDENTITY_NAME -or
              $identity.Publisher -cne $env:STEP_MSIX_PUBLISHER -or
              $properties.PublisherDisplayName -cne $env:STEP_MSIX_PUBLISHER_DISPLAY_NAME -or
              $properties.DisplayName -cne 'STeP Desktop' -or
              $identity.ProcessorArchitecture -cne 'x64') {
              throw 'The upload manifest does not match the Partner Center product.'
          }
          $sha = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $recorded = (Get-Content "$package.sha256" -Raw).Trim().Split(' ')[0]
          if ($sha -cne $recorded) { throw 'The MSIX SHA-256 does not match.' }
          $report = [ordered]@{
              file = Split-Path $package -Leaf
              displayName = $properties.DisplayName
              name = $identity.Name
              publisher = $identity.Publisher
              publisherDisplayName = $properties.PublisherDisplayName
              version = $identity.Version
              architecture = $identity.ProcessorArchitecture
              signed = $false
              sha256 = $sha
          } | ConvertTo-Json
          $report | Set-Content 'release/msix-verification/store-upload.json' -Encoding utf8
          Write-Host $report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step-desktop-msix-verification
          path: desktop/release/msix-verification/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: step-desktop-msix-${{ steps.package.outputs.kind }}-unsigned
          path: desktop/release/msix-output/
          if-no-files-found: error
