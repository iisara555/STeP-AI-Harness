name: Capture README GUI screenshots

on:
  workflow_dispatch:
  push:
    branches: [docs/gui-screenshots]
    paths:
      - desktop/test/readme-screenshots.mjs
      - .github/workflows/readme-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Capture actual Electron GUI
        run: xvfb-run -a node test/readme-screenshots.mjs
      - name: Commit screenshots to the documentation branch
        shell: bash
        run: |
          mkdir -p ../docs/images/gui
          cp release/readme/*.png ../docs/images/gui/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/gui/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: refresh real STeP Desktop GUI screenshots"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: readme-gui-screenshots
          path: desktop/release/readme/*.png
          if-no-files-found: error
