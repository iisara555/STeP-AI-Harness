name: Capture README GUI screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/src/**'
      - 'desktop/test/readme-screenshots.mjs'
      - '.github/workflows/readme-screenshots.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      # Electron downloads its binary on first use, inside Playwright's 45 s launch timeout; a slow mirror then fails
      # the capture (2026-11-19: three runs timed out after 3–33 minutes of download). Fetch it first, as validate.yml does.
      - name: Download the Electron binary
        run: node -e "require('electron')"
      - name: Capture actual Electron GUI
        run: xvfb-run -a node test/readme-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: readme-gui-screenshots
          path: desktop/release/readme/*.png
          if-no-files-found: error
