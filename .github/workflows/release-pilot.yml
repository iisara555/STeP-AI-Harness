name: Publish Pilot Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - scripts/build_pilot_bundle.py
      - .github/workflows/release-pilot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=STeP-AI-Pilot-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          awk -v heading="## v$VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "CHANGELOG.md has no '## v$VERSION' section; add release notes before publishing."
            exit 1
          fi
          # CHANGELOG links are relative to the repository root; on the release
          # page they must point at this tag's files or they 404.
          sed -E -i "s#\]\(((docs|rules|manifest|skills)/[^)]+|[A-Za-z-]+\.md)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/\1)#g" dist/release-notes.md

      - name: Validate repository
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/validate_repo.py

      - name: Verify pinned Node runtime supply chain
        if: steps.existing.outputs.exists != 'true'
        run: bash scripts/verify_node_runtime_pins.sh

      - name: Check updater script syntax
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          bash -n Install-STeP-AI.command
          bash -n Update-STeP-AI.command
          bash -n Feedback-STeP-AI.command
          bash -n install/install-macos.sh
          bash -n install/update-macos.sh
          bash -n install/feedback-macos.sh
          bash -n Check-Privacy-STeP-AI.command
          bash -n install/privacy-macos.sh
          bash -n install/macos-runtime.sh
          pwsh -NoProfile -Command "@('install/windows-runtime.ps1','install/install-windows.ps1','install/update-windows.ps1','install/feedback-windows.ps1','install/privacy-windows.ps1') | ForEach-Object { \$null = [scriptblock]::Create((Get-Content -Raw \$_)) }; Write-Host 'PowerShell syntax OK'"

      - name: Build Pilot ZIP
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/build_pilot_bundle.py

      - name: Run CLI and module unit tests
        if: steps.existing.outputs.exists != 'true'
        run: npm test

      - name: Verify package tarball contents
        if: steps.existing.outputs.exists != 'true'
        run: npm pack --dry-run

      - name: Generate SHA-256 checksum
        if: steps.existing.outputs.exists != 'true'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          test -f "dist/$ASSET"
          gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "STeP AI Harness Pilot $TAG" \
            --notes-file dist/release-notes.md

      - name: Existing release
        if: steps.existing.outputs.exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "Release $TAG already exists; leaving the published artifact unchanged."
