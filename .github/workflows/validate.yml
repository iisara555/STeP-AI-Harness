name: Validate TeamAI Harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate skills, scan secrets, and verify package whitelist
        run: python3 scripts/validate_repo.py
      - name: Build pilot distribution bundle
        run: python3 scripts/build_pilot_bundle.py
      - name: Run CLI and module unit tests
        run: npm test
      - name: Verify package tarball contents
        run: npm pack --dry-run
