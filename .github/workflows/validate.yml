name: Validate TeamAI Harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate skills, scan secrets, and verify package whitelist
        run: python3 scripts/validate_repo.py
      - name: Verify pinned Node runtime supply chain
        run: bash scripts/verify_node_runtime_pins.sh
      - name: Build pilot distribution bundle
        run: python3 scripts/build_pilot_bundle.py
      - name: Check local OCR Python syntax
        run: python3 -m py_compile experiments/local-thai-ocr/*.py
      - name: Check updater script syntax
        shell: bash
        run: |
          bash -n Install-STeP-AI.command
          bash -n Update-STeP-AI.command
          bash -n Feedback-STeP-AI.command
          bash -n install/install-macos.sh
          bash -n install/update-macos.sh
          bash -n install/feedback-macos.sh
          bash -n Check-Privacy-STeP-AI.command
          bash -n install/privacy-macos.sh
          bash -n install/macos-runtime.sh
          pwsh -NoProfile -Command "@('install/windows-runtime.ps1','install/install-windows.ps1','install/update-windows.ps1','install/feedback-windows.ps1','install/privacy-windows.ps1') | ForEach-Object { \$null = [scriptblock]::Create((Get-Content -Raw \$_)) }; Write-Host 'PowerShell syntax OK'"

      - name: Run CLI and module unit tests
        run: npm test
      - name: Verify package tarball contents
        run: npm pack --dry-run

  windows-tests:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run root tests and annotate failures
        shell: bash
        run: |
          if npm test > .root-test-ci.log 2>&1; then
            cat .root-test-ci.log
          else
            cat .root-test-ci.log
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync('.root-test-ci.log', 'utf8').split(/\r?\n/);
          const escape = text => text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          for (const [index, line] of lines.entries()) {
            if (/^\s*not ok\b/.test(line)) {
              console.log('::error title=Windows root test failure::' + escape(lines.slice(index, index + 45).join('\n').slice(0, 3500)));
            }
          }
          NODE
            exit 1
          fi
      - run: npm run validate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run format:check
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check Desktop formatting
        shell: bash
        run: |
          if ! npm run format:check; then
            npm run format
            git diff -- electron src test
            exit 1
          fi
      - run: npm test
      - run: npm run build

  desktop-macos-electron:
    # Release packaging runs on macOS too. Keep its real Electron/browser smoke in main CI so
    # native WebContentsView regressions are caught before a desktop-v* tag is created.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify Electron chat, browser and tools on macOS
        run: npm run test:electron
